name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy==1.24.4 scipy==1.9.1 tomli==2.0.1
      - name: Compile Python sources
        run: >-
          python -m compileall -q
          -x '(FDIPS|FDIPS_SWMF|PSI-master|Corona_image_process/MGN)'
          .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
